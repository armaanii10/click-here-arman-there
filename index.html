<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Name — Links</title>
  <meta name="description" content="Find me around the web." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-start: #0f172a;
      --bg-end: #1e293b;
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.1);
      --fg: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }
    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      display: grid;
      place-items: center;
      font-size: 40px;
      font-weight: 700;
      color: white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.2px;
    }
    p.bio {
      color: var(--muted);
      margin: 0;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    a.link {
      display: block;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
      text-align: center;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    a.link:hover,
    a.link:focus-visible {
      background: var(--card-hover);
      transform: translateY(-1px);
      outline: none;
    }
    footer {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">YN</div>
    <h1>Your Name</h1>
    <p class="bio">Short bio or tagline goes here.</p>

    <nav class="links" aria-label="Social links">
      <a class="link" href="https://github.com/yourhandle" target="_blank" rel="noopener">GitHub</a>
      <a class="link" href="https://twitter.com/yourhandle" target="_blank" rel="noopener">Twitter / X</a>
      <a class="link" href="https://linkedin.com/in/yourhandle" target="_blank" rel="noopener">LinkedIn</a>
      <a class="link" href="mailto:you@example.com">Email</a>
    </nav>

    <footer>&copy; <span id="year"></span> Your Name</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
